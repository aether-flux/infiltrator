[package]
name = "infiltrator"
version = "1.0.1"
edition = "2024"
authors = ["Amartya Chowdhury"]
description = "A sleek, aesthetic keyboard-driven macro overlay for Linux. Expand text, run shell snippets, and open URLs from a fullscreen ambient overlay."
readme = "README.md"
repository = "https://github.com/aether-flux/infiltrator"
homepage = "https://github.com/aether-flux/infiltrator"
license = "MIT"
keywords = ["macro", "text-expander", "wayland", "overlay", "egui"]
categories = ["command-line-utilities", "gui"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]
rustdoc-args = ["--cfg", "docsrs"]

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
eframe = "0.36.2"
enigo = { version = "0.6.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
