[package]
name = "infiltrator"
version = "1.0.0"
edition = "2024"
authors = ["Amartya Chowdhury work.amar05@yahoo.com"]
description = "A sleek, aesthetic ambient macro overlay utility."
readme = "README.md"
repository = "https://github.com/aether-flux/infiltrator"
homepage = "https://github.com/aether-flux/infiltrator"
license = "MIT"
keywords = ["wayland", "macro", "text", "egui", "overlay"]
categories = ["command-line-utilities", "gui"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[badges]
maintenance = { status = "actively-developed" }

[dependencies]
anyhow = "1.0.104"
directories = "6.0.0"
eframe = "0.36.2"
enigo = { version = "0.6.1", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.6"
